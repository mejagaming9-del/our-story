<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Story by Nissi & Kaylee</title>
  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", "Cormorant Garamond", serif;
      background: #f4f1e9;
      text-align: center;
    }

    /* Door styling */
    .door {
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('libdoor.png') center center / cover no-repeat;
      cursor: pointer;
      color: white;
      font-size: 3.5em;
      font-weight: bold;
      text-shadow: 3px 3px 8px black;
      animation: pulse 2s infinite;
      border: 12px solid #4b2e2e;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.7), 0 0 30px rgba(0,0,0,0.8);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Library shelf */
    .library {
      display: none;
      padding: 40px;
    }
    .shelf {
      background: url('bookshel.png') center center / cover no-repeat;
      padding: 40px;
      margin: 20px auto;
      width: 90%;
      height: 600px;
      display: flex;
      justify-content: space-evenly;
      align-items: flex-end;
    }

    /* Book styling */
    .book {
      width: 140px;
      height: 200px;
      background: url('Copilot_20260913_150659.png') center center / cover no-repeat;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      color: white;
      font-weight: bold;
      padding-bottom: 10px;
    }
    .book:hover { transform: scale(1.1) rotate(-2deg); }

    /* Reader styling */
    .reader {
      display: none;
      margin: 40px auto;
      width: 80%;
      background: purple;
      border-radius: 10px;
      padding: 20px;
    }
    .book-view {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 600px;
      margin: 0 auto;
      background: url('bookopen.png') center center / contain no-repeat;
    }
    .page {
      position: absolute;
      top: 55px;
      width: 40%;
      height: 70%;
      background: transparent;
      padding: 25px;
      line-height: 1.8;
      color: #2b1d0e;
      font-size: 1.3em;
      overflow: hidden; /* no scrolling */
    }
    .page.left { left: 50px; text-align: left; }
    .page.right { right: 50px; text-align: left; }

    /* Controls */
    .controls { margin-top: 20px; text-align: center; }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #8b4513;
      color: white;
      font-size: 1em;
      transition: background 0.3s ease;
    }
    button:hover { background: #a0522d; }
  </style>
</head>
<body>
  <!-- Door -->
  <div class="door" id="door">🚪 Enter Our Story</div>

  <!-- Library -->
  <div class="library" id="library">
    <h1>📚 Our Story Shelf</h1>
    <div class="shelf">
      <div class="book" id="book1">Book 1</div>
      <div class="book" id="book2">Book 2</div>
      <div class="book" id="book3">Book 3</div>
      <div class="book" id="book4">Book 4</div>
    </div>
  </div>

  <!-- Reader -->
  <div class="reader" id="reader">
    <div class="book-view">
      <div class="page left"></div>
      <div class="page right"></div>
    </div>
    <div class="controls">
      <button id="prevPage">⬅ Back</button>
      <button id="nextPage">Next ➡</button>
      <button id="saveProgress">Save Progress</button>
      <button id="closeBook">Close Book</button>
    </div>
  </div>

  <script>
    const door = document.getElementById("door");
    const library = document.getElementById("library");
    const book1 = document.getElementById("book1");
    const reader = document.getElementById("reader");
    const leftPage = document.querySelector(".left");
    const rightPage = document.querySelector(".right");
    const nextPageBtn = document.getElementById("nextPage");
    const prevPageBtn = document.getElementById("prevPage");
    const saveBtn = document.getElementById("saveProgress");
    const closeBtn = document.getElementById("closeBook");

    // Story split into ~5 lines per page
    const storyPages = [
      `The story introduces us to our two main characters Nissi the Senior and Kaylee the junior year student,
       both regular high school students learning to navigate through teen life while dealing with school and everyday life.
       Nissi and Kaylee had never talked before but little did they know one call was going to change their lives forever.
       Nissi was on a call with his friend Simba and his girlfriend.
       They added a girl Nissi had thought was cute in the past, but he knew his friend Nolan wanted a girlfriend, so he put his feelings aside to help Nolan.`,

      `He starts trying to get them together. One thing leads to the other.
       Nissi and Kaylee start texting and Nissi is falling for her more and more but keeps neglecting it because Nolan now wants Kaylee.
       As we go further Nissi and Kaylee now hb and hg.
       Nissi looks out for Kaylee, gets worried about her.
       Kaylee still doesn’t show any interest in Nissi and starts moving to Nolan.`,

      `Nolan starts flexing to Simba and Nissi his texts with Kaylee.
       Nissi always gets jealous and mad at how Nolan doesn’t value her.
       He bottles his emotions and tries to push her away but keeps failing.
       One day his other hg tells him her friend likes him.
       Nissi sees this as a distraction from Kaylee and texts her.`,

      `Two days later the girl immediately asks him to be her boyfriend.
       Nissi is taken aback by this but agrees in the heat of the moment.
       Nissi starts dating her.
       During this he realises he made a mistake.
       The girl barely talks to him, she is always out.`,

      `Nissi breaks up with her on the 21st of May.
       On the 22nd he tells Kaylee how he felt and she says she likes him too.
       The next day they start dating but fate had other plans.
       To be continued...`
    ];

    let currentPage = 0;

    if(localStorage.getItem("progress")) {
      currentPage = parseInt(localStorage.getItem("progress"));
    }

    function showSpread() {
      leftPage.innerHTML = `
        <div>${storyPages[currentPage] || ""}</div>
        <div style="position:absolute;bottom:10px;right:20px;font-size:0.9em;color:#555;">
          Page ${currentPage+1}
        </div>`;
      
      rightPage.innerHTML = `
        <div>${storyPages[currentPage+1] || ""}</div>
        <div style="position:absolute;bottom:10px;right:20px;font-size:0.9em;color:#555;">
          Page ${currentPage+2}
        </div>`;
    }

    door.onclick = () => {
      door.style.display = "none";
      library.style.display = "block";
    };

    book1.onclick = () => {
      library.style.display = "none";
      reader.style.display = "block";
      showSpread();
    };

    nextPageBtn.onclick = () => {
      if (currentPage < storyPages.length - 2) {
        currentPage += 2;
        showSpread();
      }
    };

    prevPageBtn.onclick = () => {
      if (currentPage > 0) {
        currentPage -= 2;
        showSpread();
      }
    };

    saveBtn.onclick = () => {
      localStorage.setItem("progress", currentPage);
      alert("Progress saved!");
    };

    closeBtn.onclick = () => {
      reader.style.display = "none";
      library.style.display = "block";
    };
  </script>
</body>
</html>
